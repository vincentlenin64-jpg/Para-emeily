<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Emily ❤️</title>
<style>
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; overflow:hidden;
  display:flex; align-items:center; justify-content:center;
  font-family:Arial,sans-serif;
  background:radial-gradient(circle at center,#3b0718 0%,#15030a 45%,#050505 100%);
  color:white;
}
.card{
  width:min(90%,430px); padding:42px 25px; text-align:center;
  background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.15);
  border-radius:28px; backdrop-filter:blur(12px);
  box-shadow:0 20px 70px rgba(0,0,0,.5);
}
.heart{font-size:64px; animation:pulse 1.4s infinite}
h1{font-size:32px; line-height:1.15; margin:12px 0 14px}
p{font-size:18px; line-height:1.5; opacity:.9}
.buttons{height:120px; position:relative; margin-top:18px}
button{
  position:absolute; border:0; border-radius:999px; padding:15px 30px;
  font-size:18px; font-weight:bold; cursor:pointer; transition:.2s;
}
#yes{background:#ff2f68;color:white;left:20%;top:20px;box-shadow:0 8px 25px #ff2f6855}
#no{background:white;color:#222;right:20%;top:20px}
#result{display:none}
#result h2{font-size:34px;margin:10px 0}
#result p{font-size:20px}
@keyframes pulse{50%{transform:scale(1.12)}}
.floating{
 position:fixed; bottom:-40px; font-size:28px; pointer-events:none;
 animation:float 4s linear forwards;
}
@keyframes float{to{transform:translateY(-110vh) rotate(25deg);opacity:0}}
</style>
</head>
<body>
<div class="card" id="question">
  <div class="heart">❤️</div>
  <h1>Emily, ¿quieres ser mi novia?</h1>
  <p>Hay una pregunta que quería hacerte de una manera un poquito especial...</p>
  <div class="buttons">
    <button id="yes">Sí ❤️</button>
    <button id="no">No 😈</button>
  </div>
</div>

<div class="card" id="result">
  <div class="heart">💖</div>
  <h2>¡Sabía que dirías que sí! 🥰</h2>
  <p>
    Gracias por elegirme. Quiero seguir compartiendo contigo
    risas, momentos, abrazos y muchos recuerdos bonitos.
    <br><br>
    Te quiero muchísimo, Emily. ❤️
  </p>
</div>

<script>
const no=document.getElementById('no');
const yes=document.getElementById('yes');
const question=document.getElementById('question');
const result=document.getElementById('result');

function moveNo(){
  const x=Math.random()*70+10, y=Math.random()*65+5;
  no.style.left=x+'%'; no.style.top=y+'px';
  no.style.right='auto';
}
['mouseenter','touchstart','click'].forEach(e=>no.addEventListener(e,(ev)=>{
  if(e!=='click') ev.preventDefault();
  moveNo();
}));

yes.addEventListener('click',()=>{
  question.style.display='none';
  result.style.display='block';
  for(let i=0;i<35;i++){
    setTimeout(()=>{
      const s=document.createElement('div');
      s.className='floating';
      s.textContent=['❤️','💖','💕','💗','💘'][Math.floor(Math.random()*5)];
      s.style.left=Math.random()*100+'vw';
      s.style.animationDuration=(2.5+Math.random()*2.5)+'s';
      document.body.appendChild(s);
      setTimeout(()=>s.remove(),5500);
    },i*70);
  }
});
</script>
</body>
</html>
